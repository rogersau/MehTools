name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build JamesTools.sln --configuration Release
      - name: Test
        run: dotnet run --project tests/JamesTools.Tests --configuration Release --no-build
      - name: WPF layout and close regression checks
        run: dotnet run --project tests/JamesTools.UiTests --configuration Release --no-build
      - name: MCP backend, sessions, protocol and security tests
        run: |
          dotnet run --project tests/JamesTools.Mcp.BackendTests -c Release --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/JamesTools.Mcp.SessionTests -c Release --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/JamesTools.Mcp.Tests -c Release --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
