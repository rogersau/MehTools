name: Package Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet run --project tests/JamesTools.Tests -c Release
      - name: Publish self-contained app
        run: dotnet publish src/JamesTools/JamesTools.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -o artifacts/publish
      - name: Create archive
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/JamesTools-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JamesTools-win-x64
          path: artifacts/JamesTools-win-x64.zip
