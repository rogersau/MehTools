name: Package Windows app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet run --project tests/JamesTools.Tests -c Release
      - name: WPF layout and close regression checks
        run: dotnet run --project tests/JamesTools.UiTests -c Release
      - name: Publish self-contained app
        run: dotnet publish src/JamesTools/JamesTools.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -o artifacts/publish
      - name: Validate MCP server before packaging
        run: |
          dotnet run --project tests/JamesTools.Mcp.BackendTests -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/JamesTools.Mcp.SessionTests -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/JamesTools.Mcp.Tests -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (!(Test-Path artifacts/publish/tools/mcp/MehTools.Mcp.exe)) { throw 'Published MCP server is missing.' }
      - name: Read app version
        id: version
        run: |
          $version = (Get-Item artifacts/publish/MehTools.exe).VersionInfo.ProductVersion
          $version = ($version -split '\+')[0]
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Zip portable build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/MehTools-$env:VERSION-win-x64.zip"
      - name: Build installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y }
          iscc "/DAppVersion=$env:VERSION" installer/MehTools.iss
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MehTools-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/*.zip
            artifacts/installer/*.exe
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = "MehTools-setup-$env:VERSION-win-x64.exe"
          $portable = "MehTools-$env:VERSION-win-x64.zip"
          $downloads = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME"
          @"
          ## Download for Windows

          - [Download the Windows installer]($downloads/$setup). Run it and keep **Launch Meh Tools** checked.
          - [Download the portable ZIP]($downloads/$portable). Extract the whole archive and open **MehTools.exe**.

          On first launch, choose **Record my games** to set up OBS or **Monitor performance** to try the on-screen monitor.
          "@ | Set-Content artifacts/release-notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" --title "Meh Tools $env:GITHUB_REF_NAME" --generate-notes --notes-file artifacts/release-notes.md "artifacts/$portable" "artifacts/installer/$setup"
